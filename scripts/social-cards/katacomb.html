<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
<style>
  :root {
    --accent-1: #f2d5b2;
    --accent-2: #d9a978;
    --accent-3: #a57d5c;
    --glow: #c39874;
  }
</style>
<div class="card">
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="edge"></div>
  <div class="body">
    <div class="mark mark--tile">
      <img src="../../static/img/katacomb.svg" alt="">
    </div>
    <div class="copy">
      <h1 class="title">Katacomb VPN</h1>
      <p class="sub">Desktop client for the Sentinel dVPN network. Pick a node
        anywhere, pay for the session on-chain, and the tunnel comes up.</p>
      <ul class="chips">
        <li>Linux x86_64</li>
        <li>6 protocols</li>
        <li>No accounts</li>
      </ul>
    </div>
  </div>
  <div class="foot">
    <img src="../../static/img/trinity.svg" alt="">
    <span>Trinity</span>
  </div>
</div>
